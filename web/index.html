  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0D1514;
      color-scheme: dark light;
    }
    /* Pre-render splash: fixed overlay, so mounting the Flutter canvas cannot shift layout. */
    #hermes-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0D1514;
      z-index: 2147483647;
      transition: opacity 400ms ease;
    }
    #hermes-splash[hidden] {
      display: none;
    }
    #hermes-splash.is-done {
      opacity: 0;
      pointer-events: none;
    }
    #hermes-splash .hermes-bar {
      width: 96px;
      height: 2px;
      border-radius: 1px;
      background-color: rgba(203, 163, 116, 0.2);
      overflow: hidden;
    }
    #hermes-splash .hermes-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background-color: #CBA374;
      animation: hermes-slide 1.1s ease-in-out infinite;
    }
    @keyframes hermes-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #hermes-splash .hermes-bar::after { animation: none; width: 100%; }
    }
    @media (prefers-color-scheme: light) {
      html, body { background-color: #F5F2ED; }
      #hermes-splash { background-color: #F5F2ED; }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>

<body>
  <div id="hermes-splash" aria-hidden="true">
    <div class="hermes-bar"></div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById('hermes-splash');
      function hideSplash() {
        if (!splash || splash.classList.contains('is-done')) return;
        splash.classList.add('is-done');
        setTimeout(function () { splash.hidden = true; }, 420);
      }
      window.addEventListener('flutter-first-frame', hideSplash);
      // Safety net: never trap the app behind the splash if the event is not emitted.
      setTimeout(hideSplash, 15000);
    })();

    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
